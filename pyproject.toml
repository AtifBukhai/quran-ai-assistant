[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-ai-assistant"
version = "1.0.0"
description = "Strictly grounded Quran AI Assistant (RAG). Answers only from retrieved Quran verses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quran AI Assistant" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "qdrant-client>=1.10,<2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real multilingual embeddings + language detection. Optional so the core runs offline
# with the deterministic fallbacks in app/embeddings.py and app/retrieval.py.
ml = [
    "sentence-transformers>=2.6",
    "fasttext-langdetect>=1.0.5",
]
# Cloud generation adapter (strict grounding). Optional.
cloud = [
    "anthropic>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
quran-ingest = "app.ingest.run:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
